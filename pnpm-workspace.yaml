packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Prerelease builds required by the Cloudflare adapter are exempted from the
# minimum release age gate. Keep this list as small as possible.
minimumReleaseAgeExclude:
  - "@astrojs/cloudflare@14.4.1"
  - miniflare@5.20261012.0-beta || 5.20261012.1-beta
  - wrangler@4.151.1
  - "@cloudflare/workers-types@5.20261019.1"
